  <script type="text/plain" id="code-cerradura">
#include <Keypad.h>
#include <Servo.h>

// 1. Configuración del Teclado Matricial 4x4
const byte FILAS = 4;
const byte COLUMNAS = 4;

char teclas[FILAS][COLUMNAS] = {
  {'1', '2', '3', 'A'},  // S1 a S3
  {'4', '5', '6', 'B'},  // S5 a S7
  {'7', '8', '9', 'C'},  // S9 a S11
  {'*', '0', '#', 'D'}   // S4 (Abrir), S8 (Reset), S12 (Cambiar), S16 (Confirmar)
};

byte pinesFilas[FILAS] = {9, 8, 7, 6};      // R1 a R4
byte pinesColumnas[COLUMNAS] = {5, 4, 3, 2}; // C1 a C4

Keypad teclado = Keypad(makeKeymap(teclas), pinesFilas, pinesColumnas, FILAS, COLUMNAS);

// 2. Configuración del Servomotor
Servo miServo;
const int PIN_SERVO = 11;
const int ANGULO_CERRADO = 160;
const int ANGULO_ABIERTO = 60;

// 3. Configuración de LEDs
const int LED_ROJO = 10;
const int LED_VERDE = 12;

// 4. Variables de Control
String claveCorrecta = "1234";
String claveIngresada = "";
bool modoCambioClave = false;

void setup() {
  Serial.begin(9600);

  miServo.attach(PIN_SERVO);
  miServo.write(ANGULO_CERRADO);

  pinMode(LED_VERDE, OUTPUT);
  pinMode(LED_ROJO, OUTPUT);

  // Asegurar que los LEDs arranquen apagados
  digitalWrite(LED_VERDE, LOW);
  digitalWrite(LED_ROJO, LOW);

  Serial.println("=========================================");
  Serial.println("  SISTEMA DE CERRADURA ELECTRÓNICA LISTO ");
  Serial.println("=========================================");
}

void loop() {
  char tecla = teclado.getKey();

  if (tecla) {
    Serial.print("Tecla detectada: ");
    Serial.println(tecla);

    // Si se presiona un número (S1 a S10)
    if (tecla >= '0' && tecla <= '9') {
      claveIngresada += tecla;
      Serial.print("Ingresando: ");
      Serial.println(claveIngresada);
    } 
    
    // S4 ('A'): Validar clave y abrir puerta
    else if (tecla == 'A') {
      if (!modoCambioClave) {
        verificarYAbrir();
      }
    } 
    
    // S8 ('B'): Restablecer clave predeterminada
    else if (tecla == 'B') {
      claveCorrecta = "1234";
      claveIngresada = "";
      modoCambioClave = false;
      digitalWrite(LED_VERDE, LOW);
      digitalWrite(LED_ROJO, LOW);
      Serial.println("[RESET] Clave restablecida a 1234");
      parpadearLed(LED_VERDE, 3);
    } 
    
    // S12 ('C'): Entrar en modo cambio de clave
    else if (tecla == 'C') {
      if (claveIngresada == claveCorrecta) {
        modoCambioClave = true;
        claveIngresada = "";
        digitalWrite(LED_VERDE, HIGH); // LED Verde fijo en modo edición
        Serial.println("[CAMBIO] Ingrese nueva clave y presione S16.");
      } else {
        Serial.println("[ERROR] Clave actual incorrecta.");
        parpadearLed(LED_ROJO, 2);
        claveIngresada = "";
      }
    } 
    
    // S16 ('D'): Guardar nueva clave
    else if (tecla == 'D') {
      if (modoCambioClave) {
        if (claveIngresada.length() > 0) {
          claveCorrecta = claveIngresada;
          Serial.print("[ÉXITO] Nueva clave guardada: ");
          Serial.println(claveCorrecta);
          modoCambioClave = false;
          digitalWrite(LED_VERDE, LOW); // Apaga el LED verde
          parpadearLed(LED_VERDE, 2);
        } else {
          Serial.println("[ERROR] La clave no puede estar vacía.");
        }
        claveIngresada = "";
      }
    }
  }
}

void verificarYAbrir() {
  if (claveIngresada == claveCorrecta) {
    Serial.println(">> ACCESO CONCEDIDO <<");
    digitalWrite(LED_VERDE, HIGH);
    digitalWrite(LED_ROJO, LOW);
    
    miServo.write(ANGULO_ABIERTO);
    delay(4000); // Puerta abierta durante 4 segundos
    
    miServo.write(ANGULO_CERRADO);
    digitalWrite(LED_VERDE, LOW); // Apaga obligatoriamente el LED verde
    Serial.println("Puerta bloqueada.");
  } else {
    Serial.println(">> ACCESO DENEGADO <<");
    digitalWrite(LED_VERDE, LOW);
    digitalWrite(LED_ROJO, HIGH);
    delay(3000);
    digitalWrite(LED_ROJO, LOW);
  }
  
  claveIngresada = "";
}

void parpadearLed(int pin, int veces) {
  for (int i = 0; i < veces; i++) {
    digitalWrite(pin, HIGH);
    delay(150);
    digitalWrite(pin, LOW);
    delay(150);
  }
}
  </script>

  <script type="text/plain" id="code-garaje">
#include <Arduino.h>
#include <IRremote.hpp>
#include <Servo.h>

const int IR_PIN = 9;      // O el pin donde tengas el servo
const int RECV_PIN = 11;   // Pin del receptor IR
const int SERVO_PIN = 9;   // Pin de señal del servo

// Reemplaza con el código del botón que elegiste para controlar el portón
const unsigned long BOTON_PORTON = 0xE718FF00; 

Servo porton;
bool estaAbierto = false; // Estado inicial del portón (cerrado)

void setup() {
  Serial.begin(9600);
  IrReceiver.begin(RECV_PIN, ENABLE_LED_FEEDBACK);
  
  porton.attach(SERVO_PIN);
  porton.write(0); // Posición inicial: 0 grados (cerrado)
  Serial.println("Sistema listo. Presiona el boton configurado para abrir/cerrar.");
}

void loop() {
  if (IrReceiver.decode()) {
    // Leemos el código recibido ignorando las repeticiones (0x0)
    unsigned long codigo = IrReceiver.decodedIRData.decodedRawData;

    if (codigo == BOTON_PORTON) {
      if (!estaAbierto) {
        Serial.println("Abriendo porton...");
        // Movimiento suave para abrir hasta 90 grados
        for (int pos = 0; pos <= 90; pos += 2) { 
          porton.write(pos);
          delay(15);
        }
        estaAbierto = true;
      } else {
        Serial.println("Cerrando porton...");
        // Movimiento suave para cerrar hasta 0 grados
        for (int pos = 90; pos >= 0; pos -= 2) { 
          porton.write(pos);
          delay(15);
        }
        estaAbierto = false;
      }
    }
    
    IrReceiver.resume(); // Listo para la siguiente lectura
  }
}
  </script>

          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function resaltar(codigo) {
        const patron = /(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(^[ \t]*#.*$)|(\b(?:0[xX][0-9A-Fa-f]+|\d+(?:\.\d+)?)\b)|(\b(?:void|setup|loop|int|long|byte|char|bool|boolean|float|double|unsigned|String|const|if|else|for|while|switch|case|break|return|true|false|HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|Serial|Servo|Keypad|pinMode|digitalWrite|digitalRead|analogRead|analogWrite|delay|millis|attach|write|begin|print|println|getKey|makeKeymap|length|IrReceiver|ENABLE_LED_FEEDBACK|decode|resume)\b)/gm;
        let salida = '';
        let ultimo = 0;
        for (const m of codigo.matchAll(patron)) {
          salida += escaparHtml(codigo.slice(ultimo, m.index));
          let clase = 'tk-az';
          if (m[1]) clase = 'tk-gr';
          else if (m[2] || m[3] || m[4]) clase = 'tk-na';
          salida += '<span class="' + clase + '">' + escaparHtml(m[0]) + '</span>';
          ultimo = m.index + m[0].length;
        }
        return salida + escaparHtml(codigo.slice(ultimo));
      }

      function button(label, target, extra) {
        return '<button class="action" data-page="' + target + '"' +
          (extra === undefined ? '' : ' data-index="' + extra + '"') +
          '>' + label + '</button>';
      }

      function render() {
        let html = '';

        if (page === 'menu') {
          html = '<h2>¿QUÉ VAS A HACER?</h2>' +
            button('▶ POKÉDEX DE TRABAJOS', 'pokedex') +
            button('▶ NUESTRO EQUIPO', 'equipo') +
            button('▶ ACERCA DEL PROYECTO', 'acerca') +
            '<p class="status">SELECCIONA UNA OPCIÓN</p>';
        }

        if (page === 'pokedex') {
          html = '<h2>POKÉDEX INFORMÁTICA</h2>' +
            '<p>REGISTROS: 008</p><div class="entry-grid">' +
            trabajos.map((t, i) =>
              '<button class="entry" data-page="detalle" data-index="' + i + '">' +
              '<small>N.º ' + String(i + 1).padStart(3, '0') + '</small>' +
              '<strong>' + t.titulo + '</strong></button>'
            ).join('') +
            '</div><p class="status">SELECCIONA UN REGISTRO</p>';
        }

        if (page === 'detalle') {
          const t = trabajos[selected];
          const botonesProyectos = t.proyectos
            ? t.proyectos.map((p, i) => button('▶ ' + p.titulo.toUpperCase(), 'proyecto', i)).join('')
            : '';
          html = '<h2>REGISTRO N.º ' +
            String(Number(selected) + 1).padStart(3, '0') + '</h2>' +
            '<div class="detail"><small>' + t.tipo + '</small>' +
            '<h3>' + t.titulo + '</h3><p>' + t.descripcion + '</p>' +
            (t.enlace || t.proyectos ? '' : '<p><strong>ARCHIVO:</strong> enlace pendiente de incorporar.</p>') +
            '</div>' +
            (t.enlace
              ? '<a class="action view-work" href="' + t.enlace + '" target="_blank" rel="noopener noreferrer">VER TRABAJO ↗</a>'
              : (t.proyectos ? '' : '<p>Cuando agreguemos el archivo real, aquí estará disponible el botón VER TRABAJO.</p>')) +
            botonesProyectos +
            button('↩ VOLVER A LA POKÉDEX', 'pokedex');
        }

        if (page === 'proyecto') {
          const t = trabajos[selected];
          const p = t.proyectos[selectedSub];
          const bloque = p.codigoId ? root.querySelector('#' + p.codigoId) : null;
          const codigo = bloque ? bloque.textContent.trim() : '';
          html = '<h2>' + p.titulo.toUpperCase() + '</h2>' +
            '<div class="detail"><p>' + p.descripcion + '</p></div>' +
            (codigo
              ? '<p><strong>CÓDIGO ARDUINO</strong></p><pre class="code-view"><code>' + resaltar(codigo) + '</code></pre>'
              : '<p>Código pendiente de incorporar.</p>') +
            (p.descarga
              ? '<a class="action btn-link" href="' + p.descarga + '" target="_blank" rel="noopener noreferrer">⬇ DESCARGAR CÓDIGO</a>'
              : '') +
            (p.proceso
              ? '<a class="action view-work" href="' + p.proceso + '" target="_blank" rel="noopener noreferrer">VER PROCESO ↗</a>'
              : '') +
            button('↩ VOLVER AL REGISTRO', 'detalle');
        }

        if (page === 'equipo') {
          html = '<h2>NUESTRO EQUIPO</h2>' +
            '<div class="detail"><p>ENTRENADORES INFORMÁTICOS</p>' +
            '<p>Integrantes: pendiente de completar.</p>' +
            '<p>Curso: pendiente de completar.</p></div>' +
            button('↩ VOLVER AL MENÚ', 'menu');
        }

        if (page === 'acerca') {
          html = '<h2>ACERCA DEL PROYECTO</h2>' +
            '<div class="detail"><p>Este portafolio reúne los trabajos realizados durante el año en la materia Informática.</p>' +
            '<p>Exploramos hardware, software, redes, sistemas numéricos y electrónica.</p></div>' +
            button('↩ VOLVER AL MENÚ', 'menu');
        }

        content.innerHTML = html;

        if (page === 'pokedex') {
          const backButton = document.createElement('button');
          backButton.textContent = 'VOLVER';
          backButton.dataset.action = 'back';
          backButton.className = 'pt-back-button';
          content.prepend(backButton);
        }

        root.querySelector('#pt-screen').scrollTop = 0;
      }

      function navigate(target, index) {
        if (target === 'detalle' && page === 'pokedex') {
          historyPages.push('pokedex');
        } else if (target === 'pokedex' && page === 'detalle') {
          // Al volver desde un trabajo, no agregamos otra entrada.
        } else if (target !== page) {
          historyPages.push(page);
        }

        if (index !== undefined) {
          if (target === 'proyecto') {
            selectedSub = Number(index);
          } else {
            selected = Number(index);
          }
        }

        page = target;
        render();
      }

      function goBack() {
        if (page === 'proyecto') {
          page = 'detalle';
        } else if (page === 'detalle') {
          page = 'pokedex';
        } else if (page === 'pokedex') {
          page = 'menu';
          historyPages.length = 0;
        } else if (historyPages.length > 0) {
          page = historyPages.pop();
        } else {
          page = 'menu';
        }
        render();
      }

      root.addEventListener('click', function (event) {
        const backBtn = event.target.closest('button[data-action="back"]');
        if (backBtn && root.contains(backBtn)) {
          goBack();
          return;
        }

        const btn = event.target.closest('button[data-page]');
        if (!btn || !root.contains(btn)) return;

        navigate(btn.dataset.page, btn.dataset.index);
      });

      root.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' || event.key === 'Backspace') {
          if (page !== 'inicio') {
            event.preventDefault();
            goBack();
          }
        }
      });
    })();
  </script>
</div>
